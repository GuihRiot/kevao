<style>

/* ---------- sessão ---------- */
let sess=ls.get("kv_moto");
async function auth(path,body){
  const r=await fetch(SB+"/auth/v1/token?grant_type="+path,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error_description||j.msg||"LOGIN"),{status:r.status});
  sess={at:j.access_token,rt:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000};ls.set("kv_moto",sess);return sess;
}
async function token(){
  if(!sess)throw Object.assign(new Error("SEM_SESSAO"),{status:401});
  if(Date.now()>sess.exp-60000){try{await auth("refresh_token",{refresh_token:sess.rt});}catch(e){if(e.status===400||e.status===401){sess=null;ls.del("kv_moto");}throw e;}}
  return sess.at;
}
async function rpc(fn,body){
  const t=await token();
  const r=await fetch(SB+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+t,"Content-Type":"application/json"},body:JSON.stringify(body||{})});
  const x=await r.text();let j=null;try{j=x?JSON.parse(x):null;}catch(e){}
  if(r.status===401){sess=null;ls.del("kv_moto");throw Object.assign(new Error("SEM_SESSAO"),{status:401});}
  if(!r.ok)throw Object.assign(new Error((j&&j.message)||"REDE"),{code:(j&&j.message)||"REDE"});

function telaLogin(msg){
  stopPoll();$("sair").hidden=true;$("menu").hidden=true;
  const u=el("input",{type:"text",autocomplete:"username",autocapitalize:"none",value:ls.get("kv_moto_u")||"motoboy"}),s=el("input",{type:"password",autocomplete:"current-password",placeholder:"Senha"});
  const er=el("div",{class:"err"},msg||"");er.hidden=!msg;
  const b=el("button",{class:"btn",onclick:async()=>{
    er.hidden=true;b.disabled=true;b.textContent="Entrando…";
    const us=u.value.trim().toLowerCase();ls.set("kv_moto_u",us);
    try{await auth("password",{email:us.includes("@")?us:us+"@kevao.local",password:s.value});inicia();}
    catch(e){b.disabled=false;b.textContent="Entrar";er.textContent=e.status===400?"Usuário ou senha incorretos.":"Sem conexão. Tente de novo.";er.hidden=false;}

}

/* ---------- painel ---------- */
let dados=null,skew=0,poll=null,tick=null,lembrou=ls.get("kv_moto_lemb")||{};

const nome=o=>String(o.cliente||"Cliente");
const itensTxt=o=>(o.itens||[]).map(i=>i.q+"× "+i.n+(i.combo?" + combo":"")).join(", ");
const naRota=()=>(dados?dados.pedidos:[]).filter(o=>o.moto&&!o.entregueEm&&o.status==="nocaixa");

async function carrega(){
  try{const r=await rpc("motoboy_painel");dados=r;skew=(r.agora||Date.now())-Date.now();render();lembra();}
  catch(e){
    if(e.status===401)return telaLogin("Sua sessão expirou. Entre de novo.");
    if(e.code==="SEM_ACESSO"){sess=null;ls.del("kv_moto");return telaLogin("Este usuário não tem acesso ao painel do motoqueiro.");}
    const s=$("sync");if(s){s.textContent="Sem conexão. Tentando de novo…";s.style.color="var(--wr)";}
  }
}
function stopPoll(){clearInterval(poll);clearInterval(tick);poll=tick=null;}
function inicia(){
  $("sair").hidden=false;$("menu").hidden=false;stopPoll();
  if(!dados)$("app").replaceChildren(el("div",{class:"vazio"},"Carregando entregas…"));
  carrega();poll=setInterval(()=>{if(!document.hidden)carrega();},15000);
  tick=setInterval(()=>{if(dados&&!document.hidden&&!document.querySelector(".ov")){render();lembra();}},30000);
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&sess&&poll)carrega();});
const dataBR=t=>new Date(t).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});

    el("div",{class:"mut",style:"font-size:14px;margin-bottom:6px"},c.ultimoRepasse?"Contando desde o último acerto, em "+dataBR(c.ultimoRepasse)+".":"Contando desde a primeira entrega."),
    el("div",{class:"lin"},el("span",{},"Desde o último acerto"),el("b",{},String(c.desde||0))),
    el("div",{class:"lin"},el("span",{},"Valor a receber"),el("b",{},brl(c.valor))),
    el("div",{class:"lin"},el("span",{},"Hoje"),el("b",{},String(c.hoje||0))),

    el("p",{class:"mut",style:"font-size:13px;margin:10px 0 0"},c.modo==="fixo"?"Valor por entrega definido pela loja.":"Valor = soma das taxas de entrega cobradas."),

function lembra(){
  const late=naRota().filter(o=>o.saiuEm&&(agora()-o.saiuEm)/60000>prevMin(o));
  const novos=late.filter(o=>!lembrou[o.id]||agora()-lembrou[o.id]>5*60000);

  document.title=late.length?"("+late.length+") Confirme a entrega · KEVÃO":"KEVÃO · Motoqueiro";
}

  const feitos=ps.filter(o=>o.entregueEm).sort((a,b)=>b.entregueEm-a.entregueEm);

  if(ct)blocos.push(el("button",{class:"cont",onclick:abreMenu},el("span",{class:"n"},String(ct.desde||0)),el("span",{},el("b",{},(ct.desde===1?"entrega":"entregas")+" desde o último acerto"),el("small",{},"A receber: "+brl(ct.valor)+" · Hoje: "+(ct.hoje||0))),el("span",{class:"vai"},"›")));
  if(late.length)blocos.push(el("div",{class:"aviso"},late.length>1?"Duas ou mais entregas passaram do tempo previsto. Se já entregou, confirme abaixo.":"A entrega #"+late[0].num+" passou do tempo previsto. Se já entregou, confirme abaixo."));
  blocos.push(el("h2",{},el("span",{},"Sua rota agora"),el("span",{},rota.length?String(rota.length):"")));
  if(!rota.length){
    blocos.push(feitos.length&&agora()-feitos[0].entregueEm<20*60000?el("div",{class:"fim"},"Rota concluída! Pode voltar para a loja."):el("div",{class:"vazio"},"Nenhuma entrega com você agora."));

    if(rota.length)blocos.push(el("p",{class:"mut",style:"margin:0 0 6px;font-size:14px"},"Termine e confirme a rota atual para pegar as próximas."));
    prox.forEach(o=>blocos.push(el("div",{class:"mini"},el("div",{},el("b",{},"#"+(o.num||"")+" · "+nome(o)),el("span",{class:"mut",style:"font-size:14px"},endTxt(o))),
      el("span",{class:"tag"+(o.status==="pronto"?"":" coz")},o.status==="pronto"?"Pronto":"Na cozinha"))));
  }
  blocos.push(el("h2",{},el("span",{},"Entregues hoje"),el("span",{},feitos.length?String(feitos.length):"")));
  if(!feitos.length)blocos.push(el("div",{class:"vazio"},"Nenhuma ainda."));
  else feitos.forEach(o=>blocos.push(el("div",{class:"mini"},el("div",{},el("b",{},"#"+(o.num||"")+" · "+nome(o)),el("span",{class:"mut",style:"font-size:14px"},endTxt(o))),
    el("div",{style:"text-align:right;font-size:14px"},el("b",{},hhmm(o.entregueEm)),o.saiuEm?el("span",{class:"mut"},Math.max(1,Math.round((o.entregueEm-o.saiuEm)/60000))+" min"):""))));

function cardRota(o){
  const min=o.saiuEm?Math.max(0,Math.round((agora()-o.saiuEm)/60000)):null,pv=prevMin(o),late=min!==null&&min>pv;
  const pref=o.pagPref||o.pag||"";
  const cob=o.pago?el("div",{class:"cob pg"},"JÁ PAGO"+(o.pag?" ("+o.pag+")":"")+" · NÃO COBRAR")
    :el("div",{class:"cob np"},"COBRAR "+brl(o.total),el("small",{},pref?(pref+(/Crédito|Débito/.test(pref)?" · leve a maquininha":"")+(o.troco?(/pix/i.test(o.troco)?" · troco devolvido via Pix (não precisa levar troco)":" · troco para R$ "+o.troco):"")):"Pergunte a forma de pagamento"));
  return el("div",{class:"card"+(late?" late":"")},
    el("div",{class:"num"},"#"+(o.num||"")+" · "+nome(o)),
    el("div",{class:"tempo"},min===null?"Saiu agora":(late?"PASSOU DO TEMPO PREVISTO · ":"")+"Saiu "+hhmm(o.saiuEm)+" · há "+min+" min · previsto até "+hhmm(o.saiuEm+pv*60000)),
    el("div",{class:"end"},o.end||"(sem endereço)"),o.bairro?el("div",{class:"mut"},o.bairro):"",
    el("div",{class:"acts"},o.end?el("a",{class:"btn sec",href:mapa(o),target:"_blank",rel:"noopener"},"Abrir no mapa"):"",o.fone?el("a",{class:"btn sec",href:"tel:"+String(o.fone).replace(/\D/g,"")},"Ligar"):""),
    cob,
    el("div",{class:"its"},itensTxt(o)),o.obs?el("div",{class:"its",style:"color:var(--tx)"},"Obs.: "+o.obs):"",
    el("button",{class:"btn ok",style:"margin-top:10px",onclick:()=>confirma(o)},"Confirmar entrega"));
}

function confirma(o){
  const ov=el("div",{class:"ov"}),fecha=()=>ov.remove();ov.onclick=e=>{if(e.target===ov)fecha();};
  const envia=async(pag,b)=>{
    ov.querySelectorAll("button").forEach(x=>x.disabled=true);if(b)b.textContent="Confirmando…";
    try{await rpc("motoboy_entregue",{p_id:o.id,p_pag:pag||null});fecha();vibra(120);
      const resta=naRota().filter(x=>x.id!==o.id).length;
      toast("Entrega #"+(o.num||"")+" confirmada às "+hhmm(agora())+(resta?" · faltam "+resta:" · rota concluída!"));
      o.entregueEm=agora();render();carrega();}
    catch(e){ov.querySelectorAll("button").forEach(x=>x.disabled=false);if(b)b.textContent=b.dataset.t;
      if(e.status===401){fecha();return telaLogin("Sua sessão expirou. Entre de novo.");}
      const m=ov.querySelector(".err")||el("div",{class:"err"});m.textContent=e.code==="NAO_SAIU"?"Este pedido ainda não saiu da cozinha.":"Não foi possível confirmar. Verifique a internet e tente de novo.";ov.querySelector(".sheet").prepend(m);}
  };
  const B=(t,cls,fn)=>{const b=el("button",{class:cls,onclick:()=>fn(b)},t);b.dataset.t=t;return b;};
  let corpo;
  if(o.pago){corpo=[el("h3",{},"Confirmar entrega #"+(o.num||"")+"?"),el("p",{class:"mut",style:"margin:0 0 14px"},nome(o)+" · "+(o.end||"")+". Já estava pago."),
    B("Sim, entreguei","btn ok",b=>envia(null,b)),el("button",{class:"btn sec",style:"margin-top:10px",onclick:fecha},"Voltar")];}
  else{const ms=["Crédito","Débito","Pix","Dinheiro"],pref=o.pagPref||"";
    corpo=[el("h3",{},"Entrega #"+(o.num||"")+": como o cliente pagou?"),el("p",{class:"mut",style:"margin:0"},"Valor: "+brl(o.total)+(pref?" · ele escolheu "+pref:"")),
      el("div",{class:"pgs"},...ms.map(m=>{const b=B(m,m===pref?"pref":"",bb=>envia(m,bb));return b;})),
      B("Entreguei, mas não recebi (o caixa cobra)","btn sec",b=>envia(null,b)),el("button",{class:"btn sec",style:"margin-top:10px;border-color:transparent",onclick:fecha},"Voltar")];}
  ov.append(el("div",{class:"sheet"},...corpo));document.body.append(ov);
}

if(sess)inicia();else telaLogin();
</script>
</body></html>
